name: pipeline t4

on:
  push:
    branches: [ "feature/devsecops-t4" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: gitclone
        uses: actions/checkout@v4

      - name: setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar el proyecto con mvn
        run: mvn -B clean package -DskipTests

      - name: ojala funque sonarcloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=villarwch_pet-clinic
            -Dsonar.organization=villarwch

      - name: Revisar resultado de la Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}