name: pipeline t4

on:
  push:
    branches: [ "feature/devsecops-t4" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: gitclone
        uses: actions/checkout@v4

      - name: setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar el proyecto con mvn
        run: mvn -B clean package -DskipTests